      <!-- Palm fronds -->
      <path d="M230,750 
               C230,750 100,600 50,500 
               C0,400 100,450 150,500 
               C200,550 230,750 230,750 Z"/>
      <path d="M230,750 
               C230,750 300,600 400,500 
               C500,400 400,450 350,500 
               C300,550 230,750 230,750 Z"/>
